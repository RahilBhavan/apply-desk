[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-desk"
version = "0.2.0"
description = "Member-owned application preparation and optional T3 answer proposals"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pypdf==7.0.1"]

[project.optional-dependencies]
t3 = ["mcp==1.30.0"]
test = ["mcp==1.30.0", "playwright==1.63.0"]

[project.scripts]
apply-desk = "apply_desk.__main__:main"

[tool.setuptools]
packages = ["apply_desk"]
package-dir = {apply_desk = "."}

[tool.setuptools.package-data]
apply_desk = ["web/*", "browser/*", "browser/fonts/*", "_engine/internship_applier/*.py", "_engine/internship_applier/extension/*.py", "extension-key.txt"]
